name: Build Android APK with EAS

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK with EAS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK with EAS
        run: eas build --platform android --profile apk --non-interactive --no-wait

      - name: Wait for build completion and download
        run: |
          echo "Build started successfully!"
          echo "You can monitor the build at: https://expo.dev"
          echo "The APK will be available in your Expo dashboard when ready."
          echo ""
          echo "To download the APK:"
          echo "1. Go to https://expo.dev"
          echo "2. Navigate to your project builds"
          echo "3. Download the APK when the build completes (~10-15 minutes)"
